    <style>
      :root {
        --bg: #060a16;
        --bg-2: #0b1224;
        --panel: rgba(255, 255, 255, 0.05);
        --panel-border: rgba(255, 255, 255, 0.09);
        --text: #eaf0ff;
        --text-dim: #9aa7c7;
        --accent-a: #35e6ff;
        --accent-b: #b06bff;
        --accent-c: #ff4fd8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: 'Noto Sans Bengali', 'Noto Sans', 'Helvetica Neue', Arial, sans-serif;
        overflow-x: hidden;
      }

      .backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .backdrop::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 42px 42px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 0%, black 40%, transparent 100%);
      }

      .glow {
        position: absolute;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.35;
      }

      .glow-1 { top: -10%; left: -8%; width: 46vw; height: 46vw; background: var(--accent-a); }
      .glow-2 { bottom: -14%; right: -10%; width: 52vw; height: 52vw; background: var(--accent-b); }
      .glow-3 { top: 35%; right: 20%; width: 30vw; height: 30vw; background: var(--accent-c); opacity: 0.22; }

      .wrap {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 100px 20px 80px;
      }

      @media screen and (max-width: 600px) {
        .wrap { padding-top: 70px; }
      }

      header.hero {
        text-align: center;
        padding: 20px 0 40px;
      }

      h1.tagline {
        font-size: clamp(1.6rem, 4vw, 2.6rem);
        line-height: 1.35;
        margin: 0 0 10px;
        font-weight: 700;
      }

      h1.tagline .accent {
        background: linear-gradient(90deg, var(--accent-a), var(--accent-c));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      p.sub {
        color: var(--text-dim);
        max-width: 560px;
        margin: 0 auto;
        font-size: 1rem;
      }

      .search-row {
        max-width: 480px;
        margin: 26px auto 0;
        position: relative;
      }

      .search-row input {
        width: 100%;
        padding: 14px 18px 14px 46px;
        border-radius: 14px;
        border: 1px solid var(--panel-border);
        background: var(--panel);
        color: var(--text);
        font-size: 0.95rem;
        outline: none;
        transition: border-color .2s, box-shadow .2s;
      }

      .search-row input:focus {
        border-color: var(--accent-a);
        box-shadow: 0 0 0 3px rgba(53, 230, 255, 0.15);
      }

      .search-row i {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-dim);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
        margin-top: 30px;
      }

      .card {
        display: flex;
        flex-direction: column;
        text-decoration: none;
        color: var(--text);
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        padding: 16px 18px;
        backdrop-filter: blur(10px);
        transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
      }

      .card:hover {
        transform: translateY(-4px);
        border-color: var(--accent-a);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(53, 230, 255, 0.25), 0 0 26px rgba(176, 107, 255, 0.25);
      }

      .card-index {
        font-size: 0.72rem;
        color: var(--accent-a);
        margin-bottom: 6px;
      }

      .card-title {
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.3;
      }

      .no-results {
        text-align: center;
        color: var(--text-dim);
        padding: 60px 0;
        display: none;
      }
    </style>

<div class="backdrop">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>
</div>

<div class="wrap">
  <header class="hero">
    <h1 class="tagline">সকল <span class="accent">অ্যালবাম</span></h1>
    <p class="sub" id="count-line">লোড হচ্ছে...</p>
    <div class="search-row">
      <i class="fa fa-search"></i>
      <input type="text" id="search-input" placeholder="অ্যালবাম বা শিল্পীর নাম লিখুন..." autocomplete="off">
    </div>
  </header>

  <main>
    <div class="grid" id="album-grid"></div>
    <div class="no-results" id="no-results">কোনো অ্যালবাম পাওয়া যায়নি।</div>
  </main>
</div>

    <script>
fetch('radio/songs.csv')
    .then(response => response.text())
    .then(csvText => {
        const allSongs = parseCSV(csvText);

        // Group by album_en (the canonical per-album slug that matches a
        // players/<album_en>.html page) so every card links to a real page.
        const byAlbum = new Map();
        allSongs.forEach(song => {
            const slug = song.album_en && song.album_en.trim().toLowerCase();
            if (!slug || slug === 'uncat') return;
            if (!byAlbum.has(slug)) byAlbum.set(slug, { name: song.album || slug, count: 0 });
            byAlbum.get(slug).count++;
        });

        const albums = [...byAlbum.entries()]
            .map(([slug, info]) => ({ slug, name: info.name, count: info.count }))
            .sort((a, b) => a.name.localeCompare(b.name, 'bn'));

        document.getElementById('count-line').textContent = `${convertToBanglaNumber(albums.length)}টি অ্যালবাম থেকে বেছে নিন`;

        const grid = document.getElementById('album-grid');
        albums.forEach((album, i) => {
            const card = document.createElement('a');
            card.className = 'card';
            card.href = `players/${album.slug}.html`;
            card.dataset.search = album.name.toLowerCase();
            card.innerHTML = `<div class="card-index">${convertToBanglaNumber(i + 1)}</div><div class="card-title">${escapeHtml(album.name)}</div>`;
            grid.appendChild(card);
        });

        setupSearch();
    })
    .catch(error => {
        console.error('Error fetching or parsing CSV:', error);
        document.getElementById('album-grid').innerHTML = '<p>অ্যালবাম লোড করতে সমস্যা</p>';
    });

function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
}

function setupSearch() {
    const searchInput = document.getElementById('search-input');
    const cards = Array.from(document.querySelectorAll('.card'));
    const noResults = document.getElementById('no-results');
    searchInput.addEventListener('input', function () {
        const q = this.value.trim().toLowerCase();
        let visible = 0;
        cards.forEach(function (card) {
            const match = !q || card.dataset.search.includes(q);
            card.style.display = match ? '' : 'none';
            if (match) visible++;
        });
        noResults.style.display = visible === 0 ? 'block' : 'none';
    });
}

// Utility to parse CSV into an array of objects
function parseCSV(text) {
    const lines = text.split('\n').filter(line => line.trim() !== '');
    const headers = lines[0].split(',').map(header => header.trim());
    return lines.slice(1).map(line => {
        const values = line.split(',');
        return headers.reduce((obj, header, index) => {
            obj[header] = values[index]?.trim() || '';
            return obj;
        }, {});
    });
}

// Convert standard numbers to Bangla numbers
function convertToBanglaNumber(number) {
    const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    return String(number).split('').map(digit => banglaDigits[digit]).join('');
}

// Nav
function toggleMenu() {
  var menu = document.querySelector(".topnav .menu");
  menu.classList.toggle("show");
}
    </script>
